name: 把 web/ 发布到 GitHub Pages

# 这是**可选**玩法：只把静态前端放 GitHub Pages，后端仍然跑在 Render。
#
# 为什么做成手动触发 + 变量开关：
#   前端必须知道后端地址，否则页面会去请求 github.io 上的 /api 而 404。
#   所以先在仓库设置里配好变量，这个工作流才会真正发布。
#
# 前置步骤（两处都要做）：
#   1. Settings → Secrets and variables → Actions → Variables → New variable
#        名字: LHT_API_BASE
#        值  : 你的后端地址，例如 https://wuceng-liti.onrender.com
#   2. Settings → Pages → Source 选 "GitHub Actions"
#   3. 后端（Render）要设环境变量 LHT_CORS_ORIGIN=https://szy1088.github.io
#      否则浏览器会因跨域被拦（详见 render.yaml 里的说明）
#
# 配好之后：Actions → 本工作流 → Run workflow

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.LHT_API_BASE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 把后端地址注入前端
        run: |
          sed -i "s|<meta name=\"lht-api-base\" content=\"[^\"]*\">|<meta name=\"lht-api-base\" content=\"${{ vars.LHT_API_BASE }}\">|" web/index.html
          grep -n 'lht-api-base' web/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
